<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spotify Power Tools — Search</title>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<style>
@font-face {
    font-family: "PT Fraunces";
    src: url("../resources/fonts/Fraunces-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
}

@font-face {
    font-family: "PT Fraunces";
    src: url("../resources/fonts/Fraunces-Italic.ttf") format("truetype");
    font-weight: 400;
    font-style: italic;
}

@font-face {
    font-family: "PT Inter";
    src: url("../resources/fonts/Inter-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
}

@font-face {
    font-family: "PT Inter";
    src: url("../resources/fonts/Inter-SemiBold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
}

@font-face {
    font-family: "PT JetBrains Mono";
    src: url("../resources/fonts/JetBrainsMono-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
}

:root {
    --bg-deep: #14110e;
    --bg-panel: #1a1611;
    --bg-card: #221c16;
    --bg-card-hi: #2a2319;

    --line: rgba(243,236,223,0.08);
    --line-strong: rgba(243,236,223,0.14);

    --text-hi: #f3ecdf;
    --text-mid: #c9bfae;
    --text-low: #8f8574;

    --amber: #e3a857;
    --sage: #93a68a;
    --rose: #c98a7d;

    --font-serif: "PT Fraunces", Georgia, serif;
    --font-sans: "PT Inter", "Segoe UI", sans-serif;
    --font-mono: "PT JetBrains Mono", Consolas, monospace;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--bg-deep);
    color: var(--text-hi);
    font-family: var(--font-sans);
}

body {
    position: relative;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 18% 0%, rgba(227,168,87,0.070), transparent 29%),
        radial-gradient(circle at 85% 20%, rgba(147,166,138,0.034), transparent 24%),
        linear-gradient(90deg, rgba(255,255,255,0.010), transparent 34%, rgba(227,168,87,0.014) 70%, transparent),
        var(--bg-deep);
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    opacity: 0.15;
    mix-blend-mode: overlay;
    background-image:
        radial-gradient(circle, rgba(255,255,255,0.20) 0 0.45px, transparent 0.8px),
        radial-gradient(circle, rgba(0,0,0,0.46) 0 0.52px, transparent 0.95px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 2px 3px;
}

main {
    position: relative;
    z-index: 1;
    width: min(100%, 1040px);
    margin: 0 auto;
    padding: 40px 38px 46px;
}

.page-eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.8px;
    color: var(--text-low);
}

.page-title {
    font-family: var(--font-serif);
    font-size: 30px;
    font-weight: 500;
    margin-top: 8px;
    letter-spacing: -0.35px;
}

.page-sub {
    font-size: 12.5px;
    color: var(--text-mid);
    margin-top: 8px;
}

.card {
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at 18% 0%, rgba(255,255,255,0.030), transparent 30%),
        linear-gradient(145deg, rgba(255,255,255,0.020), transparent 38%),
        rgba(34,28,22,0.92);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px 24px;
    margin-top: 20px;
    box-shadow:
        0 22px 52px rgba(0,0,0,0.20),
        inset 0 1px 0 rgba(255,255,255,0.020);
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.080;
    background-image:
        radial-gradient(circle, rgba(255,255,255,0.08) 0 0.45px, transparent 0.85px),
        radial-gradient(circle, rgba(0,0,0,0.18) 0 0.55px, transparent 0.95px);
    background-size: 5px 5px, 9px 9px;
}

.card > * {
    position: relative;
    z-index: 2;
}

.card h3 {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 15px;
}

.card h3 span {
    font-family: var(--font-sans);
    font-size: 11px;
    color: var(--text-low);
    font-weight: 500;
    margin-left: 8px;
}

.search-row {
    display: flex;
    gap: 12px;
}

.search-input {
    flex: 1;
    height: 43px;
    background:
        linear-gradient(135deg, rgba(255,255,255,0.020), transparent),
        rgba(26,22,17,0.82);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    padding: 0 16px;
    color: var(--text-hi);
    font-size: 13px;
    font-family: var(--font-sans);
    outline: none;
}

.search-input:focus {
    border-color: rgba(227,168,87,0.45);
}

.search-input::placeholder {
    color: var(--text-low);
}

.search-btn {
    height: 43px;
    min-width: 88px;
    background: var(--amber);
    color: #1a1611;
    border: none;
    border-radius: 7px;
    padding: 0 22px;
    font-size: 12.5px;
    font-weight: 700;
    font-family: var(--font-sans);
    cursor: pointer;
}

.search-btn:disabled {
    opacity: 0.52;
    cursor: default;
}

.empty-state {
    text-align: center;
    padding: 28px 20px;
}

.empty-icon {
    font-size: 25px;
    margin-bottom: 9px;
    color: var(--amber);
}

.empty-sub {
    font-size: 12.5px;
    color: var(--text-mid);
}

.result-row {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 58px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    margin-bottom: 9px;
    background: rgba(26,22,17,0.34);
}

.result-row:last-child {
    margin-bottom: 0;
}

.result-row:hover {
    border-color: var(--line-strong);
    background: var(--bg-card-hi);
}

.result-swatch {
    width: 38px;
    height: 38px;
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    border: 1px solid var(--line);
    background:
        radial-gradient(circle at 28% 20%, rgba(227,168,87,0.30), transparent 36%),
        linear-gradient(135deg, #e3a857, #221c16);
}

.result-title {
    font-size: 13px;
    font-weight: 700;
}

.result-meta {
    font-size: 11px;
    color: var(--text-mid);
    margin-top: 2px;
}

.result-add {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--line-strong);
    color: var(--text-mid);
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 11px;
    font-family: var(--font-sans);
    white-space: nowrap;
    cursor: pointer;
}

.result-row:hover .result-add {
    border-color: var(--amber);
    color: var(--amber);
}

::-webkit-scrollbar {
    width: 9px;
}

::-webkit-scrollbar-track {
    background: rgba(243,236,223,0.035);
}

::-webkit-scrollbar-thumb {
    background: rgba(227,168,87,0.42);
    border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
    background: rgba(227,168,87,0.70);
}
</style>
</head>

<body>
<main>
    <div class="page-eyebrow">search</div>
    <div class="page-title">Search Spotify</div>
    <div class="page-sub">Search for tracks and add them directly to your Spotify queue.</div>

    <section class="card">
        <h3>Find a Song</h3>

        <div class="search-row">
            <input id="searchInput" class="search-input" placeholder="Search song, artist, album..." autocomplete="off" />
            <button id="searchButton" class="search-btn" onclick="window.actions.searchNow()">Search</button>
        </div>
    </section>

    <section class="card">
        <h3 id="resultsTitle">Results</h3>
        <div id="resultsContent"></div>
    </section>
</main>

<script>
let pyBridge = null;
let debounceTimer = null;
let lastSubmittedQuery = "";
let latestInputQuery = "";
const SEARCH_DEBOUNCE_MS = 550;
const MIN_QUERY_LENGTH = 2;

window.actions = {
    searchNow() {
        const query = getQuery();

        if (!query) {
            clearSearch();
            return;
        }

        lastSubmittedQuery = "";
        submitSearch(query);
    },

    addToQueue(index) {
        if (pyBridge) {
            pyBridge.addToQueue(index);
        }
    }
};

window.searchPage = {
    update(data) {
        data = data || {};

        const searchButton = document.getElementById("searchButton");
        const resultsTitle = document.getElementById("resultsTitle");
        const resultsContent = document.getElementById("resultsContent");

        searchButton.disabled = Boolean(data.isLoading);
        searchButton.textContent = data.isLoading ? "Searching..." : "Search";

        const query = data.query || "";
        const results = data.results || [];

        if (results.length) {
            resultsTitle.innerHTML =
                `Results <span>${results.length} found${query ? ` for "${escapeHtml(query)}"` : ""}</span>`;

            resultsContent.innerHTML = results.map((song) => {
                return `
                    <div class="result-row">
                        <div class="result-swatch">🎵</div>
                        <div>
                            <div class="result-title">${escapeHtml(song.name)}</div>
                            <div class="result-meta">${escapeHtml(song.artist)}${song.album ? ` · ${escapeHtml(song.album)}` : ""}</div>
                        </div>
                        <button class="result-add" onclick="window.actions.addToQueue(${song.index})">+ Queue</button>
                    </div>
                `;
            }).join("");

            return;
        }

        resultsTitle.innerHTML = "Results";

        resultsContent.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">♪</div>
                <div class="empty-sub">${escapeHtml(data.message || "No search yet. Type a song name and press Search.")}</div>
            </div>
        `;
    }
};

function getQuery() {
    return document.getElementById("searchInput").value.trim();
}

function submitSearch(query) {
    query = String(query || "").trim();

    if (!pyBridge || !query) return;

    if (query.length < MIN_QUERY_LENGTH) return;

    if (query === lastSubmittedQuery) return;

    lastSubmittedQuery = query;
    latestInputQuery = query;

    pyBridge.search(query);
}

function clearSearch() {
    lastSubmittedQuery = "";
    latestInputQuery = "";

    clearTimeout(debounceTimer);

    if (pyBridge) {
        pyBridge.clearSearch();
    }

    window.searchPage.update({
        isLoading: false,
        query: "",
        results: [],
        message: "No search yet. Type a song name and press Search."
    });
}

const searchInput = document.getElementById("searchInput");

searchInput.addEventListener("input", function() {
    const query = getQuery();

    latestInputQuery = query;

    clearTimeout(debounceTimer);

    if (!query) {
        clearSearch();
        return;
    }

    if (query.length < MIN_QUERY_LENGTH) {
        window.searchPage.update({
            isLoading: false,
            query: query,
            results: [],
            message: "Keep typing to search Spotify."
        });
        return;
    }

    debounceTimer = setTimeout(() => {
        if (query === latestInputQuery) {
            submitSearch(query);
        }
    }, SEARCH_DEBOUNCE_MS);
});

searchInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        clearTimeout(debounceTimer);

        const query = getQuery();

        if (!query) {
            clearSearch();
            return;
        }

        lastSubmittedQuery = "";
        submitSearch(query);
    }

    if (event.key === "Escape") {
        searchInput.value = "";
        clearSearch();
    }
});

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

new QWebChannel(qt.webChannelTransport, function(channel) {
    pyBridge = channel.objects.searchBridge;
});
</script>
</body>
</html>

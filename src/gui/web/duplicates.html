<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spotify Power Tools — Duplicates</title>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<style>
@font-face {
    font-family: "PT Fraunces";
    src: url("../resources/fonts/Fraunces-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
}

@font-face {
    font-family: "PT Fraunces";
    src: url("../resources/fonts/Fraunces-Italic.ttf") format("truetype");
    font-weight: 400;
    font-style: italic;
}

@font-face {
    font-family: "PT Inter";
    src: url("../resources/fonts/Inter-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
}

@font-face {
    font-family: "PT Inter";
    src: url("../resources/fonts/Inter-SemiBold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
}

@font-face {
    font-family: "PT JetBrains Mono";
    src: url("../resources/fonts/JetBrainsMono-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
}

:root {
    --bg-deep: #14110e;
    --bg-panel: #1a1611;
    --bg-card: #221c16;

    --line: rgba(243,236,223,0.08);
    --line-strong: rgba(243,236,223,0.14);

    --text-hi: #f3ecdf;
    --text-mid: #c9bfae;
    --text-low: #8f8574;

    --amber: #e3a857;
    --sage: #93a68a;
    --rose: #c98a7d;

    --font-serif: "PT Fraunces", Georgia, serif;
    --font-sans: "PT Inter", "Segoe UI", sans-serif;
    --font-mono: "PT JetBrains Mono", Consolas, monospace;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--bg-deep);
    color: var(--text-hi);
    font-family: var(--font-sans);
}

body {
    position: relative;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 18% 0%, rgba(227,168,87,0.075), transparent 29%),
        radial-gradient(circle at 85% 20%, rgba(147,166,138,0.038), transparent 24%),
        linear-gradient(90deg, rgba(255,255,255,0.012), transparent 34%, rgba(227,168,87,0.016) 70%, transparent),
        var(--bg-deep);
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    opacity: 0.16;
    mix-blend-mode: overlay;
    background-image:
        radial-gradient(circle, rgba(255,255,255,0.20) 0 0.45px, transparent 0.8px),
        radial-gradient(circle, rgba(0,0,0,0.46) 0 0.52px, transparent 0.95px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 2px 3px;
}

main {
    position: relative;
    z-index: 1;
    width: min(100%, 1080px);
    margin: 0 auto;
    padding: 42px 40px 48px;
}

.page-eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.8px;
    color: var(--text-low);
}

.page-title {
    font-family: var(--font-serif);
    font-size: 31px;
    font-weight: 500;
    margin-top: 8px;
    letter-spacing: -0.35px;
}

.page-sub {
    font-size: 12.5px;
    color: var(--text-mid);
    margin-top: 8px;
    max-width: 640px;
    line-height: 1.55;
}

.stat-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 28px;
}

.stat-cell {
    background:
        radial-gradient(circle at 18% 0%, rgba(255,255,255,0.028), transparent 30%),
        rgba(34,28,22,0.92);
    padding: 19px 20px;
    text-align: center;
}

.stat-cell .label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-low);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.stat-cell .value {
    font-family: var(--font-serif);
    font-size: 29px;
    line-height: 1;
    margin-top: 10px;
}

.value.sage {
    color: var(--sage);
}

.value.rose {
    color: var(--rose);
}

.card {
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at 18% 0%, rgba(255,255,255,0.032), transparent 30%),
        linear-gradient(145deg, rgba(255,255,255,0.022), transparent 38%),
        rgba(34,28,22,0.92);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 24px 26px;
    margin-top: 18px;
    box-shadow:
        0 24px 56px rgba(0,0,0,0.20),
        inset 0 1px 0 rgba(255,255,255,0.022);
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.085;
    background-image:
        radial-gradient(circle, rgba(255,255,255,0.08) 0 0.45px, transparent 0.85px),
        radial-gradient(circle, rgba(0,0,0,0.18) 0 0.55px, transparent 0.95px);
    background-size: 5px 5px, 9px 9px;
}

.card > * {
    position: relative;
    z-index: 2;
}

.card h3 {
    font-family: var(--font-serif);
    font-size: 19px;
    font-weight: 500;
    margin-bottom: 10px;
}

.card h3 span {
    font-family: var(--font-sans);
    font-size: 11px;
    color: var(--text-low);
    font-weight: 500;
    margin-left: 8px;
}

.empty-state {
    text-align: center;
    padding: 26px 20px 28px;
}

.empty-icon {
    width: 45px;
    height: 45px;
    margin: 0 auto 13px;
    border-radius: 50%;
    border: 1px solid rgba(147,166,138,0.34);
    color: var(--sage);
    display: grid;
    place-items: center;
    font-size: 23px;
    background: rgba(147,166,138,0.06);
}

.empty-title {
    font-family: var(--font-serif);
    font-size: 18px;
    color: var(--sage);
}

.empty-sub {
    font-size: 12.5px;
    color: var(--text-mid);
    margin-top: 7px;
}

.empty-note {
    font-size: 11.5px;
    color: var(--text-low);
    margin-top: 16px;
    max-width: 430px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.55;
}

.btn-primary {
    display: block;
    width: 100%;
    height: 44px;
    margin-top: 14px;
    background: var(--amber);
    color: #1a1611;
    border: none;
    border-radius: 7px;
    padding: 0 13px;
    font-size: 12.5px;
    font-weight: 700;
    font-family: var(--font-sans);
    cursor: pointer;
}

.btn-primary:disabled {
    opacity: 0.42;
    cursor: default;
    filter: grayscale(0.22);
}

.dup-row {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
}

.dup-row:last-child {
    border-bottom: none;
}

.dup-info .title {
    font-size: 12.8px;
    color: var(--text-hi);
    font-weight: 700;
}

.dup-info .meta {
    font-size: 11px;
    color: var(--text-low);
    margin-top: 4px;
    line-height: 1.42;
}

.dup-count {
    font-family: var(--font-mono);
    font-size: 10.8px;
    color: var(--rose);
    background: rgba(201,138,125,0.12);
    border: 1px solid rgba(201,138,125,0.30);
    padding: 5px 10px;
    border-radius: 5px;
    white-space: nowrap;
}

::-webkit-scrollbar {
    width: 9px;
}

::-webkit-scrollbar-track {
    background: rgba(243,236,223,0.035);
}

::-webkit-scrollbar-thumb {
    background: rgba(227,168,87,0.42);
    border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
    background: rgba(227,168,87,0.70);
}
</style>
</head>

<body>
<main>
    <div class="page-eyebrow">duplicates</div>
    <div class="page-title">Duplicate Finder</div>
    <div class="page-sub">
        Find duplicate tracks and create a safe cleaned playlist copy. Your original Spotify playlist is never modified.
    </div>

    <section class="stat-row">
        <div class="stat-cell">
            <div class="label">Songs</div>
            <div id="totalSongs" class="value">0</div>
        </div>

        <div class="stat-cell">
            <div class="label">Duplicate Tracks</div>
            <div id="duplicateTracks" class="value">0</div>
        </div>

        <div class="stat-cell">
            <div class="label">Extra Copies</div>
            <div id="extraCopies" class="value">0</div>
        </div>

        <div class="stat-cell">
            <div class="label">Status</div>
            <div id="statusValue" class="value rose">No Playlist</div>
        </div>
    </section>

    <section class="card">
        <h3 id="cardTitle">Duplicate Tracks</h3>

        <div id="duplicateContent"></div>

        <button id="cleanButton" class="btn-primary" disabled onclick="window.actions.createCleanedCopy()">
            Create Cleaned Copy
        </button>
    </section>
</main>

<script>
let pyBridge = null;

window.actions = {
    createCleanedCopy() {
        if (pyBridge) {
            pyBridge.createCleanedCopy();
        }
    }
};

window.duplicatesPage = {
    update(data) {
        data = data || {};

        const stats = data.stats || {};
        const duplicates = data.duplicates || [];
        const hasPlaylist = Boolean(data.hasPlaylist);
        const hasDuplicates = Boolean(data.hasDuplicates);
        const isBusy = Boolean(data.isBusy);

        document.getElementById("totalSongs").textContent = stats.totalSongs ?? 0;
        document.getElementById("duplicateTracks").textContent = stats.duplicateTracks ?? 0;
        document.getElementById("extraCopies").textContent = stats.extraCopies ?? 0;

        const statusValue = document.getElementById("statusValue");
        statusValue.textContent = stats.status || "No Playlist";
        statusValue.className = `value ${stats.statusTone || "rose"}`;

        const content = document.getElementById("duplicateContent");
        const cardTitle = document.getElementById("cardTitle");
        const cleanButton = document.getElementById("cleanButton");

        cleanButton.disabled = !hasPlaylist || !hasDuplicates || isBusy;
        cleanButton.textContent = isBusy ? "Creating..." : "Create Cleaned Copy";

        if (!hasPlaylist) {
            cardTitle.innerHTML = "Duplicate Tracks";

            content.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">!</div>
                    <div class="empty-title" style="color:var(--rose);">No playlist detected</div>
                    <div class="empty-sub">Start playback from a Spotify playlist first.</div>
                    <div class="empty-note">
                        Duplicate detection works on the currently active playlist context.
                    </div>
                </div>
            `;

            return;
        }

        if (!hasDuplicates) {
            cardTitle.innerHTML = "Duplicate Tracks";

            content.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">✓</div>
                    <div class="empty-title">No duplicate tracks found</div>
                    <div class="empty-sub">Your playlist looks clean.</div>
                    <div class="empty-note">
                        A cleaned copy keeps the first copy of every song and removes extra duplicates.
                        There's nothing to clean right now — check back after adding more tracks.
                    </div>
                </div>
            `;

            return;
        }

        cardTitle.innerHTML =
            `Duplicate Tracks <span>${duplicates.length} found · ${stats.extraCopies || 0} extra copies</span>`;

        content.innerHTML = duplicates.map((item) => {
            return `
                <div class="dup-row">
                    <div class="dup-info">
                        <div class="title">${escapeHtml(item.name)} — ${escapeHtml(item.artist)}</div>
                        <div class="meta">
                            Album: ${escapeHtml(item.album)} ·
                            Year: ${escapeHtml(item.releaseYear)} ·
                            Duration: ${escapeHtml(item.duration)} ·
                            Appears ${escapeHtml(item.totalCopies)} times
                        </div>
                    </div>
                    <div class="dup-count">${escapeHtml(item.extraCopies)} extra</div>
                </div>
            `;
        }).join("");
    }
};

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

new QWebChannel(qt.webChannelTransport, function(channel) {
    pyBridge = channel.objects.duplicatesBridge;
});
</script>
</body>
</html>

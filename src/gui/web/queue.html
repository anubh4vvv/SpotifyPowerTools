<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spotify Power Tools — Queue</title>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<style>
@font-face {
    font-family: "PT Fraunces";
    src: url("../resources/fonts/Fraunces-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
}

@font-face {
    font-family: "PT Fraunces";
    src: url("../resources/fonts/Fraunces-Italic.ttf") format("truetype");
    font-weight: 400;
    font-style: italic;
}

@font-face {
    font-family: "PT Inter";
    src: url("../resources/fonts/Inter-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
}

@font-face {
    font-family: "PT Inter";
    src: url("../resources/fonts/Inter-SemiBold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
}

@font-face {
    font-family: "PT JetBrains Mono";
    src: url("../resources/fonts/JetBrainsMono-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
}

:root {
    --bg-deep: #14110e;
    --bg-panel: #1a1611;
    --bg-card: #221c16;
    --bg-card-hi: #2a2319;

    --line: rgba(243,236,223,0.08);
    --line-strong: rgba(243,236,223,0.14);

    --text-hi: #f3ecdf;
    --text-mid: #c9bfae;
    --text-low: #8f8574;

    --amber: #e3a857;
    --sage: #93a68a;
    --rose: #c98a7d;

    --font-serif: "PT Fraunces", Georgia, serif;
    --font-sans: "PT Inter", "Segoe UI", sans-serif;
    --font-mono: "PT JetBrains Mono", Consolas, monospace;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--bg-deep);
    color: var(--text-hi);
    font-family: var(--font-sans);
}

body {
    position: relative;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 18% 0%, rgba(227,168,87,0.070), transparent 29%),
        radial-gradient(circle at 85% 20%, rgba(147,166,138,0.034), transparent 24%),
        linear-gradient(90deg, rgba(255,255,255,0.010), transparent 34%, rgba(227,168,87,0.014) 70%, transparent),
        var(--bg-deep);
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    opacity: 0.15;
    mix-blend-mode: overlay;
    background-image:
        radial-gradient(circle, rgba(255,255,255,0.20) 0 0.45px, transparent 0.8px),
        radial-gradient(circle, rgba(0,0,0,0.46) 0 0.52px, transparent 0.95px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 2px 3px;
}

main {
    position: relative;
    z-index: 1;
    width: min(100%, 1040px);
    margin: 0 auto;
    padding: 40px 38px 46px;
}

.page-eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.8px;
    color: var(--text-low);
}

.page-title {
    font-family: var(--font-serif);
    font-size: 30px;
    font-weight: 500;
    margin-top: 8px;
    letter-spacing: -0.35px;
}

.page-sub {
    font-size: 12.5px;
    color: var(--text-mid);
    margin-top: 8px;
}

.btn-ghost-bar {
    display: block;
    width: 100%;
    height: 42px;
    margin-top: 24px;
    background:
        linear-gradient(135deg, rgba(255,255,255,0.012), transparent),
        rgba(20,17,14,0.32);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    color: var(--text-mid);
    font-size: 12.5px;
    font-family: var(--font-sans);
    font-weight: 700;
    text-align: center;
    cursor: pointer;
}

.btn-ghost-bar:hover {
    border-color: rgba(227,168,87,0.42);
    color: var(--text-hi);
}

.btn-ghost-bar:disabled {
    opacity: 0.55;
    cursor: default;
}

.card {
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at 18% 0%, rgba(255,255,255,0.030), transparent 30%),
        linear-gradient(145deg, rgba(255,255,255,0.020), transparent 38%),
        rgba(34,28,22,0.92);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px 24px;
    margin-top: 18px;
    box-shadow:
        0 22px 52px rgba(0,0,0,0.20),
        inset 0 1px 0 rgba(255,255,255,0.020);
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.080;
    background-image:
        radial-gradient(circle, rgba(255,255,255,0.08) 0 0.45px, transparent 0.85px),
        radial-gradient(circle, rgba(0,0,0,0.18) 0 0.55px, transparent 0.95px);
    background-size: 5px 5px, 9px 9px;
}

.card > * {
    position: relative;
    z-index: 2;
}

.card h3 {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 15px;
}

.now-playing {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 44px;
}

.swatch {
    width: 42px;
    height: 42px;
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    background:
        radial-gradient(circle at 28% 20%, rgba(227,168,87,0.28), transparent 36%),
        linear-gradient(135deg, #3a3226, #1a1611);
    border: 1px solid var(--line);
}

.np-title {
    font-size: 13.5px;
    font-weight: 700;
}

.np-artist {
    font-size: 11.3px;
    color: var(--text-mid);
    margin-top: 2px;
}

.queue-row {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 55px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    margin-bottom: 9px;
    background: rgba(26,22,17,0.34);
}

.queue-row:last-child {
    margin-bottom: 0;
}

.queue-row:hover {
    border-color: var(--line-strong);
    background: var(--bg-card-hi);
}

.queue-num {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-low);
    width: 18px;
    flex-shrink: 0;
}

.queue-title {
    font-size: 12.8px;
    font-weight: 700;
    max-width: 620px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.queue-artist {
    font-size: 11px;
    color: var(--text-mid);
    margin-top: 2px;
}

.queue-time {
    font-family: var(--font-mono);
    font-size: 10.8px;
    color: var(--text-low);
    margin-left: auto;
    flex-shrink: 0;
}

.empty-state {
    text-align: center;
    padding: 24px 20px;
    color: var(--text-mid);
    font-size: 12.5px;
    line-height: 1.6;
}

.empty-icon {
    font-size: 23px;
    color: var(--amber);
    margin-bottom: 9px;
}

::-webkit-scrollbar {
    width: 9px;
}

::-webkit-scrollbar-track {
    background: rgba(243,236,223,0.035);
}

::-webkit-scrollbar-thumb {
    background: rgba(227,168,87,0.42);
    border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
    background: rgba(227,168,87,0.70);
}
</style>
</head>

<body>
<main>
    <div class="page-eyebrow">queue</div>
    <div class="page-title">Spotify Queue</div>
    <div class="page-sub">View the songs currently waiting in your Spotify queue.</div>

    <button id="refreshButton" class="btn-ghost-bar" onclick="window.actions.refreshQueue()">
        ↻ Refresh Queue
    </button>

    <section class="card">
        <h3>Currently Playing</h3>
        <div id="currentlyPlaying"></div>
    </section>

    <section class="card">
        <h3>Upcoming Queue</h3>
        <div id="queueList"></div>
    </section>
</main>

<script>
let pyBridge = null;

window.actions = {
    refreshQueue() {
        if (pyBridge) {
            pyBridge.refreshQueue();
        }
    }
};

window.queuePage = {
    update(data) {
        data = data || {};

        const refreshButton = document.getElementById("refreshButton");
        refreshButton.textContent = data.isLoading ? "Loading Queue..." : "↻ Refresh Queue";
        refreshButton.disabled = Boolean(data.isLoading);

        updateCurrentlyPlaying(data.currentlyPlaying);
        updateQueue(data.queue || [], data.message || "");
    }
};

function updateCurrentlyPlaying(song) {
    const root = document.getElementById("currentlyPlaying");

    if (!song) {
        root.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">♪</div>
                No active playback
            </div>
        `;
        return;
    }

    root.innerHTML = `
        <div class="now-playing">
            <div class="swatch">🎵</div>
            <div>
                <div class="np-title">${escapeHtml(song.name)}</div>
                <div class="np-artist">${escapeHtml(song.artist)}</div>
            </div>
        </div>
    `;
}

function updateQueue(queue, message) {
    const root = document.getElementById("queueList");

    if (!queue.length) {
        root.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">🎧</div>
                ${escapeHtml(message || "No upcoming songs in queue.")}
            </div>
        `;
        return;
    }

    root.innerHTML = queue.map((song, index) => {
        const number = String(index + 1).padStart(2, "0");

        return `
            <div class="queue-row">
                <span class="queue-num">${number}</span>
                <div class="swatch" style="width:36px;height:36px;font-size:13px;">🎧</div>
                <div>
                    <div class="queue-title">${escapeHtml(song.name)}</div>
                    <div class="queue-artist">${escapeHtml(song.artist)}</div>
                </div>
                <span class="queue-time">${escapeHtml(song.duration || "—")}</span>
            </div>
        `;
    }).join("");
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

new QWebChannel(qt.webChannelTransport, function(channel) {
    pyBridge = channel.objects.queueBridge;
});
</script>
</body>
</html>

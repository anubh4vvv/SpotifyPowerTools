<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spotify Power Tools — Settings</title>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<style>
@font-face {
    font-family: "PT Fraunces";
    src: url("../resources/fonts/Fraunces-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
}

@font-face {
    font-family: "PT Fraunces";
    src: url("../resources/fonts/Fraunces-Italic.ttf") format("truetype");
    font-weight: 400;
    font-style: italic;
}

@font-face {
    font-family: "PT Inter";
    src: url("../resources/fonts/Inter-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
}

@font-face {
    font-family: "PT Inter";
    src: url("../resources/fonts/Inter-SemiBold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
}

@font-face {
    font-family: "PT JetBrains Mono";
    src: url("../resources/fonts/JetBrainsMono-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
}

:root {
    --bg-deep: #14110e;
    --bg-panel: #1a1611;
    --bg-card: #221c16;

    --line: rgba(243,236,223,0.08);
    --line-strong: rgba(243,236,223,0.14);

    --text-hi: #f3ecdf;
    --text-mid: #c9bfae;
    --text-low: #8f8574;

    --amber: #e3a857;
    --sage: #93a68a;
    --rose: #c98a7d;

    --font-serif: "PT Fraunces", Georgia, serif;
    --font-sans: "PT Inter", "Segoe UI", sans-serif;
    --font-mono: "PT JetBrains Mono", Consolas, monospace;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: var(--bg-deep);
    color: var(--text-hi);
    font-family: var(--font-sans);
}

body {
    position: relative;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 18% 0%, rgba(227,168,87,0.08), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(147,166,138,0.04), transparent 24%),
        linear-gradient(90deg, rgba(255,255,255,0.012), transparent 34%, rgba(227,168,87,0.018) 70%, transparent),
        var(--bg-deep);
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    opacity: 0.18;
    mix-blend-mode: overlay;
    background-image:
        radial-gradient(circle, rgba(255,255,255,0.22) 0 0.45px, transparent 0.8px),
        radial-gradient(circle, rgba(0,0,0,0.48) 0 0.52px, transparent 0.95px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 2px 3px;
}

main {
    position: relative;
    z-index: 1;
    width: min(100%, 1080px);
    margin: 0 auto;
    padding: 40px 40px 54px;
}

.page-eyebrow {
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 1.8px;
    color: var(--text-low);
}

.page-title {
    font-family: var(--font-serif);
    font-size: 31px;
    font-weight: 500;
    margin-top: 8px;
    letter-spacing: -0.35px;
}

.page-sub {
    font-size: 12.5px;
    color: var(--text-mid);
    margin-top: 8px;
}

.card {
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at 18% 0%, rgba(255,255,255,0.035), transparent 30%),
        linear-gradient(145deg, rgba(255,255,255,0.025), transparent 38%),
        var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px;
    margin-top: 24px;
    box-shadow:
        0 26px 60px rgba(0,0,0,0.22),
        inset 0 1px 0 rgba(255,255,255,0.025);
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.10;
    background-image:
        radial-gradient(circle, rgba(255,255,255,0.08) 0 0.45px, transparent 0.85px),
        radial-gradient(circle, rgba(0,0,0,0.18) 0 0.55px, transparent 0.95px);
    background-size: 5px 5px, 9px 9px;
}

.card > * {
    position: relative;
    z-index: 2;
}

.card h3 {
    font-family: var(--font-serif);
    font-size: 19px;
    font-weight: 500;
    margin-bottom: 22px;
}

.field {
    margin-bottom: 24px;
}

.field:last-of-type {
    margin-bottom: 0;
}

.field-label {
    display: block;
    font-size: 12px;
    color: var(--text-mid);
    margin-bottom: 10px;
}

.select-box {
    width: 100%;
    appearance: none;
    background:
        linear-gradient(135deg, rgba(255,255,255,0.025), transparent),
        var(--bg-panel);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    padding: 12px 14px;
    color: var(--text-hi);
    font-size: 12.5px;
    font-family: var(--font-sans);
    outline: none;
    cursor: pointer;
}

.select-wrap {
    position: relative;
}

.select-wrap::after {
    content: "▾";
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-low);
    font-size: 10px;
    pointer-events: none;
}

.slider-head {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.slider-head .label {
    font-size: 12px;
    color: var(--text-mid);
}

.slider-head .value {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--amber);
}

input[type="range"] {
    width: 100%;
    height: 16px;
    appearance: none;
    background: transparent;
    cursor: pointer;
}

input[type="range"]::-webkit-slider-runnable-track {
    height: 3px;
    border-radius: 4px;
    background:
        linear-gradient(
            90deg,
            var(--amber) 0%,
            var(--amber) var(--progress, 50%),
            var(--line-strong) var(--progress, 50%),
            var(--line-strong) 100%
        );
}

input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--text-hi);
    border: 2px solid var(--amber);
    margin-top: -5px;
}

.button-row {
    display: flex;
    gap: 12px;
    margin-top: 26px;
}

.btn-primary,
.btn-ghost {
    flex: 1;
    border-radius: 7px;
    padding: 13px;
    font-size: 12.5px;
    font-family: var(--font-sans);
    cursor: pointer;
}

.btn-primary {
    background: var(--amber);
    color: #1a1611;
    border: none;
    font-weight: 700;
}

.btn-ghost {
    background: transparent;
    color: var(--text-mid);
    border: 1px solid var(--line-strong);
}

.btn-ghost:hover {
    border-color: rgba(227,168,87,0.38);
    color: var(--text-hi);
}

.message {
    margin-top: 16px;
    min-height: 18px;
    color: var(--sage);
    font-size: 12px;
}

.memory-desc {
    font-size: 12px;
    color: var(--text-mid);
    margin-bottom: 18px;
    line-height: 1.6;
}

.memory-btn {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background:
        linear-gradient(135deg, rgba(255,255,255,0.018), transparent),
        var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 13px 16px;
    font-size: 12.5px;
    color: var(--text-hi);
    margin-bottom: 10px;
    cursor: pointer;
    font-family: var(--font-sans);
}

.memory-btn:last-child {
    margin-bottom: 0;
}

.memory-btn .arrow {
    color: var(--text-low);
    font-size: 12px;
}

.memory-btn.danger {
    border-color: rgba(201,138,125,0.30);
}

.memory-btn.danger:hover {
    background: rgba(201,138,125,0.06);
}

::-webkit-scrollbar {
    width: 9px;
}

::-webkit-scrollbar-track {
    background: rgba(243,236,223,0.035);
}

::-webkit-scrollbar-thumb {
    background: rgba(227,168,87,0.42);
    border-radius: 999px;
}
</style>
</head>

<body>
<main>
    <div class="page-eyebrow">settings</div>
    <div class="page-title">Settings</div>
    <div class="page-sub">Customize Spotify Power Tools and save your defaults.</div>

    <section class="card">
        <h3>Default Shuffle Settings</h3>

        <div class="field">
            <span class="field-label">Default Profile</span>
            <div class="select-wrap">
                <select id="profile" class="select-box"></select>
            </div>
        </div>

        <div class="field">
            <span class="field-label">Default Queue Size</span>
            <div class="select-wrap">
                <select id="queueSize" class="select-box"></select>
            </div>
        </div>

        <div class="field">
            <div class="slider-head">
                <span class="label">Artist Weight</span>
                <span id="artistValue" class="value">50</span>
            </div>
            <input id="artistWeight" type="range" min="0" max="100" value="50" />
        </div>

        <div class="field">
            <div class="slider-head">
                <span class="label">Album Weight</span>
                <span id="albumValue" class="value">50</span>
            </div>
            <input id="albumWeight" type="range" min="0" max="100" value="50" />
        </div>

        <div class="field">
            <div class="slider-head">
                <span class="label">Randomness</span>
                <span id="randomValue" class="value">50</span>
            </div>
            <input id="randomness" type="range" min="0" max="100" value="50" />
        </div>

        <div class="button-row">
            <button class="btn-primary" onclick="window.actions.saveSettings()">Save Settings</button>
            <button class="btn-ghost" onclick="window.actions.resetSettings()">Reset Defaults</button>
        </div>

        <div id="message" class="message"></div>
    </section>

    <section class="card">
        <h3>Memory Tools</h3>

        <div class="memory-desc">
            Manage local listening memory and album-art cache. This does not modify Spotify.
        </div>

        <button class="memory-btn" onclick="window.actions.exportMemory()">
            <span>Export Listening Memory</span>
            <span class="arrow">↗</span>
        </button>

        <button class="memory-btn danger" onclick="window.actions.clearMemory()">
            <span>Clear Listening Memory</span>
            <span class="arrow">⟲</span>
        </button>

        <button class="memory-btn danger" onclick="window.actions.clearImageCache()">
            <span>Clear Album Art Cache</span>
            <span class="arrow">⟲</span>
        </button>
    </section>
</main>

<script>
let pyBridge = null;

window.actions = {
    saveSettings() {
        if (!pyBridge) return;

        pyBridge.saveSettings(
            document.getElementById("profile").value,
            Number(document.getElementById("queueSize").value),
            Number(document.getElementById("artistWeight").value),
            Number(document.getElementById("albumWeight").value),
            Number(document.getElementById("randomness").value),
        );
    },

    resetSettings() {
        if (pyBridge) pyBridge.resetSettings();
    },

    exportMemory() {
        if (pyBridge) pyBridge.exportMemory();
    },

    clearMemory() {
        if (pyBridge) pyBridge.clearMemory();
    },

    clearImageCache() {
        if (pyBridge) pyBridge.clearImageCache();
    }
};

window.settingsPage = {
    update(data) {
        data = data || {};

        const settings = data.settings || {};
        const profiles = data.profiles || [];
        const queueSizes = data.queueSizes || [];

        const profileSelect = document.getElementById("profile");
        const queueSelect = document.getElementById("queueSize");

        profileSelect.innerHTML = "";
        queueSelect.innerHTML = "";

        profiles.forEach((profile) => {
            const option = document.createElement("option");
            option.value = profile;
            option.textContent = profile;
            profileSelect.appendChild(option);
        });

        queueSizes.forEach((size) => {
            const option = document.createElement("option");
            option.value = size;
            option.textContent = `${size} songs`;
            queueSelect.appendChild(option);
        });

        profileSelect.value = settings.shuffle_profile || "Balanced";
        queueSelect.value = String(settings.queue_size || 25);

        setSlider("artistWeight", "artistValue", settings.artist_weight ?? 50);
        setSlider("albumWeight", "albumValue", settings.album_weight ?? 50);
        setSlider("randomness", "randomValue", settings.randomness ?? 50);
    },

    setMessage(data) {
        data = data || {};
        document.getElementById("message").textContent = data.message || "";
    }
};

function setSlider(sliderId, labelId, value) {
    const slider = document.getElementById(sliderId);
    const label = document.getElementById(labelId);

    slider.value = value;
    label.textContent = value;

    slider.style.setProperty("--progress", `${value}%`);
}

["artistWeight", "albumWeight", "randomness"].forEach((sliderId) => {
    const labelId = {
        artistWeight: "artistValue",
        albumWeight: "albumValue",
        randomness: "randomValue",
    }[sliderId];

    const slider = document.getElementById(sliderId);

    slider.addEventListener("input", () => {
        setSlider(sliderId, labelId, Number(slider.value));
        document.getElementById("message").textContent = "";
    });
});

["profile", "queueSize"].forEach((id) => {
    document.addEventListener("change", (event) => {
        if (event.target && event.target.id === id) {
            document.getElementById("message").textContent = "";
        }
    });
});

new QWebChannel(qt.webChannelTransport, function(channel) {
    pyBridge = channel.objects.settingsBridge;
});
</script>
</body>
</html>
